<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
	<defs>
		<radialGradient id="glow" cx="50%" cy="32%" r="60%">
			<stop offset="0%" stop-color="#18E299" stop-opacity="0.18"/>
			<stop offset="45%" stop-color="#18E299" stop-opacity="0.05"/>
			<stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
		</radialGradient>
	</defs>
	<rect width="1200" height="630" fill="#0a0a0a"/>
	<rect width="1200" height="630" fill="url(#glow)"/>

	<!-- brand pill -->
	<g transform="translate(600, 150)">
		<rect x="-118" y="-30" width="236" height="60" rx="30" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
		<g transform="translate(-84, -16)" stroke="#18E299" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
			<rect x="3" y="13" width="22" height="14" rx="2.5"/>
			<path d="M8 13V8a6 6 0 0 1 12 0v5"/>
		</g>
		<text x="14" y="8" font-family="'Geist Mono', ui-monospace, monospace" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle">passwd.page</text>
	</g>

	<!-- headline -->
	<text x="600" y="330" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="74" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-2">The secure secret handoff</text>
	<text x="600" y="416" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="74" font-weight="700" text-anchor="middle" letter-spacing="-2"><tspan fill="#ffffff">for </tspan><tspan fill="#18E299">humans</tspan><tspan fill="#ffffff"> and </tspan><tspan fill="#18E299">agents</tspan></text>

	<!-- subline -->
	<text x="600" y="492" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#9a9a9a" text-anchor="middle">Zero-knowledge, self-destructing one-time links.</text>

	<!-- chips -->
	<text x="600" y="556" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" font-weight="500" fill="#6a6a6a" text-anchor="middle">End-to-end encrypted &#183; No signup &#183; Open source</text>
</svg>
