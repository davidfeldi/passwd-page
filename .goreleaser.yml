version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: passwd-server
    main: ./cmd/passwd-server
    binary: passwd-server
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w

  - id: passwd-cli
    main: ./cmd/passwd
    binary: passwd-page
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

  - id: passwd-mcp
    main: ./cmd/passwd-mcp
    binary: passwd-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: cli
    ids:
      - passwd-cli
    name_template: "passwd-page_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: mcp
    ids:
      - passwd-mcp
    name_template: "passwd-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: server
    ids:
      - passwd-server
    name_template: "passwd-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # Combined archive (CLI + MCP) for Homebrew. Homebrew needs a single archive
  # per os/arch, so both binaries are bundled here.
  - id: brew
    ids:
      - passwd-cli
      - passwd-mcp
    name_template: "passwd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

# Homebrew tap. Requires:
#   1. A public repo davidfeldi/homebrew-tap to exist.
#   2. A repo secret TAP_GITHUB_TOKEN (PAT with contents:write on the tap repo),
#      wired into .github/workflows/release.yml.
# Then: brew install davidfeldi/tap/passwd-page  (installs passwd-page + passwd-mcp)
brews:
  - ids: [brew]
    repository:
      owner: davidfeldi
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://passwd.page
    description: "Zero-knowledge secret sharing for humans and agents"
    license: "MIT"
    install: |
      bin.install "passwd-page"
      bin.install "passwd-mcp"
    test: |
      system "#{bin}/passwd-page", "version"

release:
  github:
    owner: davidfeldi
    name: passwd-page
  draft: false
  prerelease: auto
  header: |
    ## passwd.page {{ .Tag }}

    Install with one line:
    ```sh
    curl -fsSL https://passwd.page/install | sh
    ```
  footer: |
    **Checksums**: see `checksums.txt` in the assets below.
    **Self-host**: see [SELF_HOSTING.md](https://github.com/davidfeldi/passwd-page/blob/main/SELF_HOSTING.md).
